name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/airpage-web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: src/airpage-web
      - run: npm run build
        working-directory: src/airpage-web
      - run: dotnet restore AirPageSystem.slnx
      - run: dotnet build AirPageSystem.slnx -c Release --no-restore
