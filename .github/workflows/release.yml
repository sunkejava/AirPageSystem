name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write
  packages: write

env:
  # Keep this marker aligned with the release being published; changing it retriggers the release workflow.
  VERSION: 0.0.9
  TAG: v0.0.9

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/airpage-web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Vue application
        working-directory: src/airpage-web
        run: npm ci && npm run build
      - name: Install archive and CJK font dependencies
        run: sudo apt-get update && sudo apt-get install -y zip fonts-noto-cjk
      - name: Publish self-contained applications
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          font=$(find /usr/share/fonts -type f -name 'NotoSansCJK-Regular.ttc' | head -n 1)
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            out="publish/$rid"
            dotnet publish src/AirPageSystem.Api/AirPageSystem.Api.csproj \
              -c Release -r "$rid" --self-contained true -o "$out" \
              -p:Version="$VERSION" -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
            mkdir -p "$out/fonts" "$out/data"
            cp "$font" "$out/fonts/NotoSansCJK-Regular.ttc"
            cp README.md README.en.md "$out/"
            (cd "$out" && zip -9 -r "../../dist/AirPageSystem-$TAG-$rid.zip" .)
          done
      - name: Create Docker deployment bundle
        run: |
          mkdir -p docker-package
          cp Dockerfile docker-compose.yml README.md README.en.md docker-package/
          tar -C docker-package -czf "dist/AirPageSystem-$TAG-docker.tar.gz" .
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/airpagesystem:0.0.6
            ghcr.io/${{ github.repository_owner }}/airpagesystem:latest
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "AirPageSystem $TAG" \
            --notes-file RELEASE_NOTES.md
