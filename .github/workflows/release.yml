name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

concurrency:
  group: airpage-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  VERSION: 0.0.6
  TAG: v0.0.6
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/airpage-web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Vue application
        working-directory: src/airpage-web
        run: npm ci && npm run build
      - name: Restore and build .NET
        run: |
          dotnet restore AirPageSystem.slnx
          dotnet build AirPageSystem.slnx -c Release --no-restore -p:Version="$VERSION"

  package:
    name: Package ${{ matrix.rid }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install archive and CJK font dependencies
        run: sudo apt-get update && sudo apt-get install -y zip fonts-noto-cjk
      - name: Publish self-contained application
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          out="publish/$rid"
          font=$(find /usr/share/fonts -type f -name 'NotoSansCJK-Regular.ttc' -print -quit)
          test -n "$font"
          dotnet publish src/AirPageSystem.Api/AirPageSystem.Api.csproj \
            -c Release -r "$rid" --self-contained true -o "$out" \
            -p:Version="$VERSION" -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          mkdir -p "$out/fonts" "$out/data"
          cp "$font" "$out/fonts/NotoSansCJK-Regular.ttc"
          cp README.md README.en.md "$out/"
          (cd "$out" && zip -9 -r "../../AirPageSystem-$TAG-$rid.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: AirPageSystem-${{ matrix.rid }}
          path: AirPageSystem-${{ env.TAG }}-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Publish Docker amd64/arm64
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/airpagesystem:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/airpagesystem:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [package, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AirPageSystem-*
          path: dist
          merge-multiple: true
      - name: Create Docker deployment bundle
        run: |
          mkdir -p docker-package
          cp Dockerfile docker-compose.yml README.md README.en.md docker-package/
          tar -C docker-package -czf "dist/AirPageSystem-$TAG-docker.tar.gz" .
      - name: Verify release assets
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 7
          find dist -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "AirPageSystem $TAG" \
            --notes-file RELEASE_NOTES.md
